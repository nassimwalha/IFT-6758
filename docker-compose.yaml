# docker-compose.yml
version: '3'

services:
  serving:
    build:
      context: "./"
      dockerfile: "./Dockerfile.serving"
    image: "ift6758/serving:1.0.0"
    ports:
      - "127.0.0.1:1234:1234"
    environment:
      - "COMET_API_KEY=$COMET_API_KEY"

  streamlit:
    build:
      context: "./"
      dockerfile: "./Dockerfile.streamlit"
    image: "ift6758/streamlit:1.0.0"
    ports:
      - "127.0.0.1:8092:8092"